/* =========================================================
   STORAGE
========================================================= */

function loadData(key, fallback){

    try{

        const saved = localStorage.getItem(key);

        if(saved !== null){
            return JSON.parse(saved);
        }

    }catch(error){

        console.error(
            "Could not load:",
            key,
            error
        );

    }

    return JSON.parse(
        JSON.stringify(fallback)
    );
}


function saveData(key, value){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    }catch(error){

        console.error(
            "Could not save:",
            key,
            error
        );

        showToast(
            "Unable to save your changes."
        );

    }

}

function getInitials(name){

    if(!name){
        return "DA";
    }

    return name
        .trim()
        .split(/\s+/)
        .slice(0,2)
        .map(word => word.charAt(0))
        .join("")
        .toUpperCase();

}

/* =========================================================
   ADD / EDIT CLASS
========================================================= */

document

        "click",
        addClass

function addClass(){

    const subject =
        document
            .getElementById(
                "classSubject"
            )
            .value;


    const day =
        document
            .getElementById(
                "classDay"
            )
            .value;


    const time =
        document
            .getElementById(
                "classTime"
            )
            .value
            .trim();


    const room =
        document
            .getElementById(
                "classRoom"
            )
            .value
            .trim();


    if(
        !subject ||
        !day ||
        !time
    ){

        showToast(
            "Please complete subject, day and time."
        );

        return;

    }


    const normalizedTime =
        normalizeTime(time);


    const matchingTime =
        timetableTimes.find(
            t =>
                normalizeTime(t) ===
                normalizedTime
        );


    if(!matchingTime){

        showToast(
            "Use a timetable time such as 7:00 - 8:00."
        );

        return;

    }


    if(
        !timetable[matchingTime]
    ){

        timetable[matchingTime] = {};

    }


    timetable[matchingTime][day] = [

        subject,

        room || "No room",

        getSubjectColor(subject)

    ];


    saveData(
        "studysmartTimetable",
        timetable
    );


    renderDashboardTimetable();

    renderTimetable();

    updateStats();


    document.getElementById(
        "classSubject"
    ).value = "";


    document.getElementById(
        "classDay"
    ).value = "";


    document.getElementById(
        "classTime"
    ).value = "";


    document.getElementById(
        "classRoom"
    ).value = "";


    showToast(
        `${subject} added successfully!`
    );

}


function normalizeTime(value){

    return value
        .replace(/[–—]/g,"-")
        .replace(/\s+/g,"")
        .toLowerCase();

}


function getSubjectColor(subject){

    const colors = [
        "green",
        "orange",
        "blue",
        "purple",
        "pink",
        "teal"
    ];


    let hash = 0;


    for(
        let i=0;
        i<subject.length;
        i++
    ){

        hash =
            subject.charCodeAt(i) +
            ((hash << 5) - hash);

    }


    return colors[
        Math.abs(hash) %
        colors.length
    ];

}


/* CLASS CLICK */

document.addEventListener(
    "click",
    event => {

        const classBox =
            event.target.closest(
                ".class-box"
            );


        if(!classBox){
            return;
        }


        const time =
            classBox.dataset.time;


        const day =
            classBox.dataset.day;


        if(
            time &&
            day
        ){

            editClass(
                time,
                day
            );

        }

    }
);


function editClass(
    time,
    day
){

    const data =
        timetable[time]?.[day];


    if(!data){
        return;
    }


    openModal(
        "Edit Class",

        `

        <input
            id="editClassSubject"
            value="${escapeAttribute(data[0])}"
            placeholder="Subject"
        >

        <input
            id="editClassRoom"
            value="${escapeAttribute(data[1])}"
            placeholder="Room"
        >

        <button
            class="primary-btn"
            onclick="saveEditedClass(
                '${escapeAttribute(time)}',
                '${escapeAttribute(day)}'
            )"
        >
            Save Changes
        </button>

        <button
            class="danger-btn"
            style="height:42px"
            onclick="deleteClass(
                '${escapeAttribute(time)}',
                '${escapeAttribute(day)}'
            )"
        >
            Delete Class
        </button>

        `
    );

}


function saveEditedClass(
    time,
    day
){

    const subject =
        document
            .getElementById(
                "editClassSubject"
            )
            .value
            .trim();


    const room =
        document
            .getElementById(
                "editClassRoom"
            )
            .value
            .trim();


    if(!subject){

        showToast(
            "Enter a subject."
        );

        return;

    }


    timetable[time][day] = [

        subject,

        room || "No room",

        getSubjectColor(subject)

    ];


    saveData(
        "studysmartTimetable",
        timetable
    );


    renderDashboardTimetable();

    renderTimetable();

    updateStats();

    closeModal();

    showToast(
        "Class updated!"
    );

}


function deleteClass(
    time,
    day
){

    if(
        !confirm(
            `Delete the ${day} ${time} class?`
        )
    ){

        return;

    }


    delete timetable[time][day];


    saveData(
        "studysmartTimetable",
        timetable
    );


    renderDashboardTimetable();

    renderTimetable();

    updateStats();

    closeModal();

    showToast(
        "Class deleted."
    );

}

function createSubject(){

    const name =
        document
            .getElementById(
                "newSubjectName"
            )
            .value
            .trim();


    const teacher =
        document
            .getElementById(
                "newSubjectTeacher"
            )
            .value
            .trim();


    const progress =
        Number(
            document
                .getElementById(
                    "newSubjectProgress"
                )
                .value
        ) || 0;


    if(!name){

        showToast(
            "Enter a subject name."
        );

        return;

    }


    const exists =
        subjects.some(
            subject =>
                subject.name
                    .toLowerCase() ===
                name.toLowerCase()
        );


    if(exists){

        showToast(
            "That subject already exists."
        );

        return;

    }


    subjects.push({

        name,

/* =========================================================
   CALENDAR
========================================================= */

function formatDateKey(
    year,
    month,
    day
){

    return [

        year,

        String(month + 1)
            .padStart(2,"0"),

        String(day)
            .padStart(2,"0")

    ].join("-");

}


function formatDateTime(value){

    const date =
        new Date(value);


    return date.toLocaleString(
        "en-US",
        {
            dateStyle:"medium",
            timeStyle:"short"
        }
    );

}


function renderCalendar(){

    const grid =
        document.getElementById(
            "calendarGrid"
        );


    const monthTitle =
        document.getElementById(
            "calendarMonth"
        );


    const year =
        currentCalendarDate
            .getFullYear();


    const month =
        currentCalendarDate
            .getMonth();


    monthTitle.textContent =
        currentCalendarDate.toLocaleString(
            "en-US",
            {
                month:"long",
                year:"numeric"
            }
        );


    grid.innerHTML = "";


    [
        "Sun",
        "Mon",
        "Tue",
        "Wed",
        "Thu",
        "Fri",
        "Sat"
    ].forEach(
        day => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "calendar-day-name";


            element.textContent =
                day;


            grid.appendChild(
                element
            );

        }
    );


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for(
        let i=0;
        i<firstDay;
        i++
    ){

        grid.innerHTML +=
            "<div></div>";

    }


    const today =
        new Date();


    for(
        let day=1;
        day<=daysInMonth;
        day++
    ){

        const key =
            formatDateKey(
                year,
                month,
                day
            );


        const isToday =
            day ===
            today.getDate()
            &&
            month ===
            today.getMonth()
            &&
            year ===
            today.getFullYear();


        const element =
            document.createElement(
                "div"
            );


        element.className =
            `calendar-day ${
                isToday
                ? "today"
                : ""
            }`;


        element.dataset.date =
            key;


        element.innerHTML = `

            <span>${day}</span>

        `;


        const events =
            calendarEvents[key] || [];


        events.forEach(
            event => {

                const eventElement =
                    document.createElement(
                        "div"
                    );


                eventElement.className =
                    "calendar-event";


                eventElement.textContent =
                    event;


                element.appendChild(
                    eventElement
                );

            }
        );


        element.addEventListener(
            "click",
            () => {

                addCalendarEvent(
                    key
                );

            }
        );


        grid.appendChild(
            element
        );

    }

}

            "statClasses"
        );


    const taskElement =
        document.getElementById(
            "statTasks"
        );


    const reminderElement =
        document.getElementById(
            "statReminders"
        );


    if(subjectElement){

        subjectElement.textContent =
            subjects.length;

    }


    let classCount = 0;


    Object.values(
        timetable
    ).forEach(
        row => {

            classCount +=
                Object.keys(row)
                    .length;

        }
    );


    if(classElement){

        classElement.textContent =
            classCount;

    }


    const pendingTasks =
        tasks.filter(
            task =>
                !task.completed
        ).length;


    if(taskElement){

        taskElement.textContent =
            pendingTasks;

    }


    const pendingReminders =
        settings.notifications
        ? reminders.filter(
            reminder =>
                !reminder.completed
        ).length
        : 0;


    if(reminderElement){

        reminderElement.textContent =
            pendingReminders;

    }


    const badge =
        document.getElementById(
            "notificationCount"
        );


    if(badge){

        badge.textContent =
            pendingReminders;


        badge.style.display =
            pendingReminders > 0 &&
            settings.notifications
            ? "flex"
            : "none";

    }

}


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(value ?? "");


    return div.innerHTML;

}


function escapeAttribute(value){

    return String(
        value ?? ""
    )
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


/* =========================================================
   KEYBOARD ACCESSIBILITY
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
         * Ctrl/Cmd + K
         * opens subject search
         */

        if(
            (event.ctrlKey ||
             event.metaKey)
            &&
            event.key.toLowerCase() ===
            "k"
        ){

            event.preventDefault();


            showPage("subjects");


            const search =
                document.getElementById(
                    "subjectSearch"
                );


            if(search){

                search.focus();

            }

        }

    }
);


/* =========================================================
   CLOSE SIDEBAR WHEN CLICKING OUTSIDE
========================================================= */

document.addEventListener(
    "click",
    event => {

        const sidebar =
            document.getElementById(
                "sidebar"
            );


        const mobileMenu =
            document.getElementById(
                "mobileMenu"
            );


        if(
            window.innerWidth <= 800
            &&
            sidebar.classList.contains(
                "open"
            )
            &&
            !sidebar.contains(event.target)
            &&
            !mobileMenu.contains(event.target)
        ){

            sidebar.classList.remove(
                "open"
            );

        }

    }
);


/* =========================================================
   INITIALIZE APPLICATION
========================================================= */

applyDarkMode(
    settings.darkMode
);


notificationToggle.classList.toggle(
    "on",
    settings.notifications
);


if(autoSaveToggle){

    autoSaveToggle.classList.toggle(
        "on",
        settings.autoSave
    );

}


renderDashboardTimetable();

renderSubjects();

renderTasks();

renderReminders();

renderCalendar();

updateProfileUI();

updateStats();


/* =========================================================
   WELCOME
========================================================= */

setTimeout(
    () => {

        showToast(
            `Welcome back, ${profile.name}!`
        );

    },
    600
);

</script>
